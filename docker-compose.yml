services:
  db:
    image: postgres:13-alpine
    container_name: export-engine-db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=exports_db
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=64MB
      -c maintenance_work_mem=256MB
      -c effective_cache_size=512MB
    ports:
      - "5432:5432"
    volumes:
      - ./seeds/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d exports_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - export-network
    mem_limit: 1g
    mem_reservation: 512m

  app:
    build: .
    container_name: export-engine-app
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/exports_db
      - PORT=${PORT:-8080}
      - NODE_ENV=production
      - LOG_LEVEL=info
      - EXPORT_BATCH_SIZE=5000
      - EXPORT_TEMP_DIR=/tmp/exports
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - export-network
    mem_limit: 256m
    mem_reservation: 128m

networks:
  export-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
